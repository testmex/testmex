
name: Tidy Up

on:
  push:

jobs:
  trigger-cursor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for // TIDYUP in added lines
        id: tidyup
        run: |
          git fetch origin main
          if git diff origin/main...HEAD | grep '^+[^+]' | grep -qF '// TIDYUP'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No newly added lines containing // TIDYUP, skipping webhook."
          fi

      - name: Trigger Cursor webhook
        if: steps.tidyup.outputs.found == 'true'
        env:
          CURSOR_WEBHOOK_TOKEN: ${{ secrets.CURSOR_AUTOMATION_WEBHOOK_TOKEN }}
        run: |
          curl -sf -X POST \
            "https://api2.cursor.sh/automations/webhook/4a8a5535-75ee-11f1-a7d1-d6b4613131ce" \
            -H "Authorization: Bearer ${CURSOR_WEBHOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg branch "${{ github.ref_name }}" '{branchName: $branch}')"
